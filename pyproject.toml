[project]
name = "ref-db"
version = "0.1.0"
description = "Local semantic and 3D head/torso pose art reference search app"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "transformers>=4.46.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
    "mediapipe>=0.10.18",
    "opencv-python>=4.10.0",
    "pillow>=11.0.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.12",
]

[project.scripts]
ref-db = "backend.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
